<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>分段写入测试</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#0f172a; color:#e2e8f0;
         min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { width:100%; max-width:420px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
          border-radius:20px; padding:32px 24px; text-align:center; }
  h1 { font-size:22px; margin-bottom:10px; }
  p { font-size:14px; color:#94a3b8; line-height:1.7; margin-bottom:20px; }
  .btn { display:inline-block; min-height:44px; line-height:44px; padding:0 28px; border-radius:22px;
         background:linear-gradient(90deg,#6366f1,#8b5cf6); color:#fff; font-size:15px; border:none; }
  .tip { margin-top:16px; font-size:12px; color:#64748b; }

</style>
</head>
<body>
  <div class="card">
    <h1>🧩 分段写入成功</h1>
    <p>这个页面由两段 write_file（第一段 write、第二段 mode=append）拼成，验证大文件防截断机制。</p>
    <button class="btn" onclick="this.textContent='✅ 拼接完好'">点我试试</button>
    <div class="tip">mode=append · 质量门 · 私有仓库拦截 · 换名重试 · 上线预热</div>
  </div>
</body>
</html>
